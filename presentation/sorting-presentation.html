<h1 id="%E4%B8%A4%E7%B1%BB%E7%89%A9%E5%93%81%E5%85%AD%E4%B8%AA%E7%9B%AE%E6%A0%87">两类物品，六个目标</h1>
<p>围绕小车摆放 <strong>3 个网球、3 个水瓶</strong>。</p>
<p>相对小车启动朝向：</p>
<ul>
<li><strong>右侧区域放球</strong>。</li>
<li><strong>左侧区域放瓶子</strong>。</li>
<li>每区固定 <strong>三个角度放置位</strong>。</li>
</ul>
<p><small>照片为实物布局；程序使用相对启动朝向定义左右。</small></p>
</section>

<h1 id="%E7%AC%AC%E4%BA%8C%E6%AD%A5%E5%AF%B9%E5%87%86%E4%BB%A5%E5%90%8E%E5%86%8D%E6%8E%A5%E8%BF%91">第二步：对准以后再接近</h1>
<p><strong>YOLO26m</strong> 检测网球或瓶子，选取最靠近抓取轴的目标。</p>
<p>偏出画面宽度 <strong>±4%</strong> 时，每次转向 <strong>5°</strong>，停车后重新识别。</p>
<p>连续 <strong>3 帧居中</strong> 后检查红外；偏远时以 <strong>4 cm/s、约 1 cm 一步</strong> 接近。</p>
<p><small>demo2 当前阈值为原始读数 ≤25 mm，连续3次；不等于实际2.5 cm。</small></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="photo" data-theme="yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475" lang="C" class="photo" data-marpit-pagination="9" style="" data-marpit-pagination-total="15" data-size="16:9" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="code" data-theme="yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475" lang="C" class="code" data-marpit-pagination="10" style="--paginate:true;--class:code;--theme:yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="%E7%AC%AC%E4%BA%8C%E6%AD%A5%E8%A7%86%E8%A7%89%E4%B8%8E%E8%B7%9D%E7%A6%BB%E5%85%B1%E5%90%8C%E6%94%BE%E8%A1%8C">第二步：视觉与距离共同放行</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># yolo_align_pick_place_demo.py · 判定节选</span>
<span class="hljs-keyword">if</span> stable &gt;= a[<span class="hljs-string">&#x27;stable_frames&#x27;</span>]:
    distance_state = <span class="hljs-variable language_">self</span>.infrared_state()
    <span class="hljs-keyword">if</span> distance_state == <span class="hljs-string">&#x27;ready&#x27;</span>:
        <span class="hljs-keyword">return</span> target
    <span class="hljs-keyword">if</span> distance_state == <span class="hljs-string">&#x27;far&#x27;</span>:
        <span class="hljs-variable language_">self</span>.approach_step()
        stable = <span class="hljs-number">0</span>
</code></pre>
<p><strong>每次前进后重新对准，避免沿旧图像继续走。</strong></p>
<p>单个网球和单个瓶子均已实机跑通：抓取内收 → 沿路径回位 →<br />
球向右、瓶向左 90° 放置 → 恢复初态。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="%E7%AC%AC%E4%B8%89%E6%AD%A5%E4%BB%8E%E5%8D%95%E6%AC%A1%E6%8A%93%E6%94%BE%E5%88%B0%E5%BE%AA%E7%8E%AF%E5%88%86%E6%8B%A3">第三步：从单次抓放到循环分拣</h1>
<p><strong>搜索 → 对准接近 → 抓取 → 内收回位 → 分类放置 → 下一方位</strong></p>
<ul>
<li>六个大致取物方向；每个方向记录 <strong>待取 / 已取 / 未找到</strong>。</li>
<li>球、瓶各维护三个放置位，按类别依次分配，已用位置不重复。</li>
<li>放置后 <strong>松爪、内收</strong>，转到下一搜索朝向，再外伸识别。</li>
<li>快速版按当前实际朝向，选择 <strong>转角最小的待取方位</strong>。</li>
</ul>
<p><small>正式程序：原始红外阈值24 mm，回位容差5 cm。六件整轮及三个放置角度仍待实机验证。</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="code" data-theme="yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475" lang="C" class="code" data-marpit-pagination="12" style="--paginate:true;--class:code;--theme:yckyb1fdwarm3nvxln12lndwcwli7ewdidhxnmoa475;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="%E7%AC%AC%E4%B8%89%E6%AD%A5%E7%9B%B4%E6%8E%A5%E9%80%89%E6%8B%A9%E6%9C%80%E8%BF%91%E7%9A%84%E5%BE%85%E5%8F%96%E6%96%B9%E4%BD%8D">第三步：直接选择最近的待取方位</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># object_sorting.py · 当前快速版调度函数</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">nearest_pending_direction</span>(<span class="hljs-params">directions, current_heading</span>):
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">min</span>(
        (d <span class="hljs-keyword">for</span> d <span class="hljs-keyword">in</span> directions <span class="hljs-keyword">if</span> d[<span class="hljs-string">&#x27;status&#x27;</span>] == <span class="hljs-string">&#x27;pending&#x27;</span>),
        key=<span class="hljs-keyword">lambda</span> d: <span class="hljs-built_in">abs</span>(align.wrap_degrees(
            d[<span class="hljs-string">&#x27;heading&#x27;</span>] - current_heading)),
        default=<span class="hljs-literal">None</span>)
</code></pre>
<p>完成放置后才标记 <strong>taken</strong>；没有目标标记 <strong>not_found</strong>。</p>
<p><strong>参考基准始终是启动中心与朝向</strong>，放置后无需先回正搜索。<br />
整轮结束再回正，并恢复外伸、松爪初态。</p>
</section>
